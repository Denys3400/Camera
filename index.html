<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laser Draw</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #24113d;
}

/* Полотно */
#canvas {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 2;

    pointer-events: none;
}


/* =================================
   ПЕРЕГЛЯД КАМЕРИ
   ================================= */

#cameraPreview {

    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 90vw;
    height: 70vh;

    object-fit: contain;

    background: black;

    z-index: 5;

    display: none;
}


/* =================================
   ПРИХОВАНИЙ VIDEO
   ================================= */

#video {

    position: fixed;

    width: 1px;
    height: 1px;

    opacity: 0;

    pointer-events: none;
}


/* =================================
   ЧОТИРИ КАЛІБРУВАЛЬНІ ТОЧКИ
   ================================= */

.dot {

    position: fixed;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    z-index: 10;
}


/* ЖОВТИЙ — верх ліворуч */

#yellow {

    left: 5%;
    top: 5%;

    background: #ffff00;

    box-shadow:
        0 0 10px #ffff00,
        0 0 25px #ffff00;
}


/* ЗЕЛЕНИЙ — верх праворуч */

#green {

    right: 5%;
    top: 5%;

    background: #00ff00;

    box-shadow:
        0 0 10px #00ff00,
        0 0 25px #00ff00;
}


/* СИНІЙ — низ ліворуч */

#blue {

    left: 5%;
    bottom: 5%;

    background: #0066ff;

    box-shadow:
        0 0 10px #0066ff,
        0 0 25px #0066ff;
}


/* ПОМАРАНЧЕВИЙ — низ праворуч */

#orange {

    right: 5%;
    bottom: 5%;

    background: #ff8800;

    box-shadow:
        0 0 10px #ff8800,
        0 0 25px #ff8800;
}


/* =================================
   КНОПКА
   ================================= */

#cameraButton {

    position: fixed;

    right: 15px;
    top: 50%;

    transform: translateY(-50%);

    width: 48px;
    height: 48px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,0.20);

    color: white;

    font-size: 23px;

    z-index: 20;
}


/* =================================
   СТАТУС
   ================================= */

#status {

    position: fixed;

    left: 50%;
    top: 12px;

    transform: translateX(-50%);

    color: white;

    background: rgba(0,0,0,0.4);

    padding: 7px 12px;

    border-radius: 10px;

    font-family: Arial;

    font-size: 14px;

    z-index: 20;
}


/* =================================
   СКАНУВАЛЬНИЙ CANVAS
   ================================= */

#scan {

    display: none;
}

</style>
</head>


<body>


<!-- =================================
     КАМЕРА
     ================================= -->

<video id="video"
       autoplay
       playsinline>
</video>


<!-- Камера, яку можна показати кнопкою -->

<video id="cameraPreview"
       autoplay
       playsinline>
</video>


<!-- Аналіз камери -->

<canvas id="scan"></canvas>


<!-- Малювання -->

<canvas id="canvas"></canvas>


<!-- =================================
     КАЛІБРУВАЛЬНІ ТОЧКИ
     ================================= -->

<div id="yellow" class="dot"></div>

<div id="green" class="dot"></div>

<div id="blue" class="dot"></div>

<div id="orange" class="dot"></div>


<!-- =================================
     КНОПКА
     ================================= -->

<button id="cameraButton">
📷
</button>


<div id="status">
Запуск камери...
</div>



<script>


/* =================================
   ELEMENTS
   ================================= */

const video =
    document.getElementById("video");

const preview =
    document.getElementById("cameraPreview");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const scan =
    document.getElementById("scan");

const sctx =
    scan.getContext(
        "2d",
        { willReadFrequently:true }
    );

const status =
    document.getElementById("status");


/* =================================
   ЗМІННІ
   ================================= */

let cameraReady = false;

let previewVisible = false;


/* =================================
   КУТИ
   ================================= */

let corners = {

    yellow: null,

    green: null,

    blue: null,

    orange: null
};


/* Остання позиція лазера */

let lastLaser = null;


/* =================================
   РОЗМІР ПОЛОТНА
   ================================= */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =================================
   ЗАПУСК КАМЕРИ
   ================================= */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {

                    facingMode:
                        "environment",

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }
                },

                audio: false
            });


        /* Основна камера */

        video.srcObject =
            stream;


        await video.play();


        /* Preview використовує
           той самий потік */

        preview.srcObject =
            stream;


        await preview.play();


        cameraReady = true;


        status.textContent =
            "Камера працює";


        /* Перше калібрування */

        setTimeout(
            calibrate,
            1000
        );


    } catch(error) {

        console.log(error);

        status.textContent =
            "Дозволь доступ до камери";
    }
}


/* =================================
   ПОКАЗ / ПРИХОВУВАННЯ КАМЕРИ
   ================================= */

function toggleCameraPreview() {

    previewVisible =
        !previewVisible;


    if(previewVisible) {

        preview.style.display =
            "block";

        status.textContent =
            "Перегляд камери";

    } else {

        preview.style.display =
            "none";

        status.textContent =
            "Камера прихована";
    }
}


/* =================================
   ПОШУК КОЛЬОРУ
   ================================= */

function findColor(type) {

    if(!cameraReady)
        return null;


    const W = 640;
    const H = 480;


    scan.width = W;
    scan.height = H;


    sctx.drawImage(
        video,
        0,
        0,
        W,
        H
    );


    const img =
        sctx.getImageData(
            0,
            0,
            W,
            H
        );


    const data =
        img.data;


    let sumX = 0;
    let sumY = 0;

    let count = 0;


    for(
        let y = 0;
        y < H;
        y += 2
    ) {

        for(
            let x = 0;
            x < W;
            x += 2
        ) {

            const i =
                (y * W + x) * 4;


            const r =
                data[i];

            const g =
                data[i + 1];

            const b =
                data[i + 2];


            let ok = false;


            /* =========================
               ЖОВТИЙ
               ========================= */

            if(type === "yellow") {

                ok =
                    r > 170 &&
                    g > 170 &&
                    b < 140 &&
                    r > b * 1.4 &&
                    g > b * 1.4;
            }


            /* =========================
               ЗЕЛЕНИЙ
               ========================= */

            if(type === "green") {

                ok =
                    g > 130 &&
                    g > r * 1.35 &&
                    g > b * 1.25;
            }


            /* =========================
               СИНІЙ
               ========================= */

            if(type === "blue") {

                ok =
                    b > 130 &&
                    b > r * 1.35 &&
                    b > g * 1.15;
            }


            /* =========================
               ПОМАРАНЧЕВИЙ
               ========================= */

            if(type === "orange") {

                ok =
                    r > 160 &&
                    g > 60 &&
                    g < 190 &&
                    b < 110 &&
                    r > g * 1.25;
            }


            /* =========================
               ЧЕРВОНИЙ ЛАЗЕР
               ========================= */

            if(type === "red") {

                ok =
                    r > 170 &&
                    r > g * 1.7 &&
                    r > b * 1.7 &&
                    g < 130 &&
                    b < 130;
            }


            if(ok) {

                sumX += x;

                sumY += y;

                count++;
            }
        }
    }


    if(count < 8)
        return null;


    return {

        x:
            sumX / count,

        y:
            sumY / count,

        size:
            count
    };
}


/* =================================
   КАЛІБРУВАННЯ
   ================================= */

function calibrate() {

    if(!cameraReady)
        return;


    const colors = [

        "yellow",

        "green",

        "blue",

        "orange"
    ];


    let found = 0;


    for(
        const color of colors
    ) {

        const point =
            findColor(color);


        if(point) {

            corners[color] = {

                x: point.x,

                y: point.y
            };


            found++;
        }
    }


    if(found === 4) {

        status.textContent =
            "Калібрування OK";

    } else {

        status.textContent =
            "Калібрування " +
            found +
            "/4";
    }
}


/* =================================
   КООРДИНАТИ ЛАЗЕРА
   ================================= */

function laserToScreen(p) {

    if(

        !corners.yellow ||

        !corners.green ||

        !corners.blue ||

        !corners.orange

    ) {

        return null;
    }


    const left =

        (
            corners.yellow.x +
            corners.blue.x
        ) / 2;


    const right =

        (
            corners.green.x +
            corners.orange.x
        ) / 2;


    const top =

        (
            corners.yellow.y +
            corners.green.y
        ) / 2;


    const bottom =

        (
            corners.blue.y +
            corners.orange.y
        ) / 2;


    let x =

        (p.x - left) /
        (right - left);


    let y =

        (p.y - top) /
        (bottom - top);


    x =
        Math.max(
            0,
            Math.min(1,x)
        );


    y =
        Math.max(
            0,
            Math.min(1,y)
        );


    return {

        x:
            x * canvas.width,

        y:
            y * canvas.height
    };
}


/* =================================
   ПОШУК ЛАЗЕРА
   ================================= */

function processLaser() {

    if(!cameraReady) {

        requestAnimationFrame(
            processLaser
        );

        return;
    }


    const laser =
        findColor("red");


    if(laser) {

        const point =
            laserToScreen(laser);


        if(point) {

            if(lastLaser) {

                ctx.beginPath();


                ctx.moveTo(
                    lastLaser.x,
                    lastLaser.y
                );


                ctx.lineTo(
                    point.x,
                    point.y
                );


                ctx.strokeStyle =
                    "white";


                ctx.lineWidth =
                    5;


                ctx.lineCap =
                    "round";


                ctx.lineJoin =
                    "round";


                ctx.stroke();
            }


            lastLaser =
                point;
        }

    } else {

        lastLaser =
            null;
    }


    requestAnimationFrame(
        processLaser
    );
}


/* =================================
   КНОПКА
   ================================= */

document
    .getElementById(
        "cameraButton"
    )
    .addEventListener(
        "click",
        toggleCameraPreview
    );


/* =================================
   КАЛІБРУВАННЯ КОЖНІ 5 СЕКУНД
   ================================= */

setInterval(

    () => {

        if(cameraReady) {

            calibrate();
        }

    },

    5000
);


/* =================================
   СТАРТ
   ================================= */

startCamera();

processLaser();

</script>

</body>
    </html>
