<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Laser Draw</title>

<style>
* {
    box-sizing: border-box;
}

html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#24113d;
}

/* Полотно */
#canvas {
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:2;
    pointer-events:none;
}

/* Прихована камера */
#video {
    position:fixed;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
}

/* Перегляд камери */
#preview {
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    width:90vw;
    height:80vh;

    object-fit:contain;
    background:#000;

    z-index:30;
    display:none;
}

/* Сканер */
#scan {
    display:none;
}

/* Калібрувальні точки */
.dot {
    position:fixed;

    width:22px;
    height:22px;

    border-radius:50%;

    z-index:10;
}

/* Жовтий — верхній лівий */
#yellow {
    left:4%;
    top:4%;

    background:#ffff00;

    box-shadow:
        0 0 8px #ffff00,
        0 0 16px #ffff00;
}

/* Зелений — верхній правий */
#green {
    right:4%;
    top:4%;

    background:#00ff20;

    box-shadow:
        0 0 8px #00ff20,
        0 0 16px #00ff20;
}

/* Синій — нижній лівий */
#blue {
    left:4%;
    bottom:4%;

    background:#0070ff;

    box-shadow:
        0 0 8px #0070ff,
        0 0 16px #0070ff;
}

/* Помаранчевий — нижній правий */
#orange {
    right:4%;
    bottom:4%;

    background:#ff6500;

    box-shadow:
        0 0 8px #ff6500,
        0 0 18px #ff6500;
}

/* Кнопка */
#cameraButton {
    position:fixed;

    right:12px;
    top:50%;

    transform:translateY(-50%);

    width:46px;
    height:46px;

    border:0;
    border-radius:50%;

    background:rgba(255,255,255,.20);

    color:white;
    font-size:22px;

    z-index:50;
}

/* Статус */
#status {
    position:fixed;

    left:50%;
    top:10px;

    transform:translateX(-50%);

    color:white;

    background:rgba(0,0,0,.45);

    padding:6px 10px;

    border-radius:9px;

    font:13px Arial;

    z-index:50;
}
</style>
</head>

<body>

<video id="video"
       autoplay
       playsinline>
</video>

<video id="preview"
       autoplay
       playsinline>
</video>

<canvas id="scan"></canvas>

<canvas id="canvas"></canvas>

<!-- 4 КУТИ -->
<div id="yellow" class="dot"></div>
<div id="green" class="dot"></div>
<div id="blue" class="dot"></div>
<div id="orange" class="dot"></div>

<button id="cameraButton">📷</button>

<div id="status">
Запуск...
</div>


<script>

const video =
    document.getElementById("video");

const preview =
    document.getElementById("preview");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const scan =
    document.getElementById("scan");

const sctx =
    scan.getContext("2d", {
        willReadFrequently:true
    });

const status =
    document.getElementById("status");


/* ======================================
   КАМЕРА
====================================== */

let cameraReady = false;

let previewOn = false;


/* ======================================
   КАЛІБРУВАННЯ
====================================== */

let corners = {
    yellow:null,
    green:null,
    blue:null,
    orange:null
};


/* ======================================
   ОСТАННЯ ПОЗИЦІЯ ЛАЗЕРА
====================================== */

let lastLaser = null;


/* ======================================
   РОЗМІР ПОЛОТНА
====================================== */

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* ======================================
   ЗАПУСК КАМЕРИ
====================================== */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:"environment",

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false
            });


        video.srcObject =
            stream;

        preview.srcObject =
            stream;


        await video.play();


        cameraReady = true;


        status.textContent =
            "Камера працює";


        setTimeout(
            calibrate,
            1000
        );


    } catch(e) {

        console.log(e);

        status.textContent =
            "Немає доступу до камери";
    }
}


/* ======================================
   ПЕРЕГЛЯД КАМЕРИ
====================================== */

document
.getElementById("cameraButton")
.addEventListener("click",function(){

    previewOn =
        !previewOn;


    preview.style.display =
        previewOn
        ? "block"
        : "none";

});


/* ======================================
   ПОШУК КАЛІБРУВАЛЬНИХ КОЛЬОРІВ
====================================== */

function findColor(type) {

    if(!cameraReady)
        return null;


    const W = 640;
    const H = 480;


    scan.width = W;
    scan.height = H;


    sctx.drawImage(
        video,
        0,
        0,
        W,
        H
    );


    const image =
        sctx.getImageData(
            0,
            0,
            W,
            H
        );


    const data =
        image.data;


    let sx = 0;
    let sy = 0;
    let n = 0;


    for(
        let y=0;
        y<H;
        y+=2
    ){

        for(
            let x=0;
            x<W;
            x+=2
        ){

            const i =
                (y*W+x)*4;


            const r =
                data[i];

            const g =
                data[i+1];

            const b =
                data[i+2];


            let ok=false;


            /* ЖОВТИЙ */

            if(type==="yellow"){

                ok =
                    r>160 &&
                    g>160 &&
                    b<150 &&
                    r>b*1.25 &&
                    g>b*1.25;
            }


            /* ЗЕЛЕНИЙ */

            if(type==="green"){

                ok =
                    g>120 &&
                    g>r*1.30 &&
                    g>b*1.20;
            }


            /* СИНІЙ */

            if(type==="blue"){

                ok =
                    b>120 &&
                    b>r*1.30 &&
                    b>g*1.10;
            }


            /* ПОМАРАНЧЕВИЙ */

            if(type==="orange"){

                ok =
                    r>150 &&
                    g>45 &&
                    g<210 &&
                    b<120 &&
                    r>g*1.15 &&
                    r>b*1.8;
            }


            if(ok){

                sx+=x;
                sy+=y;

                n++;
            }
        }
    }


    if(n<5)
        return null;


    return {
        x:sx/n,
        y:sy/n
    };
}


/* ======================================
   КАЛІБРУВАННЯ
====================================== */

function calibrate(){

    if(!cameraReady)
        return;


    let names=[
        "yellow",
        "green",
        "blue",
        "orange"
    ];


    let found=0;


    for(
        const name of names
    ){

        const p =
            findColor(name);


        if(p){

            corners[name]={
                x:p.x,
                y:p.y
            };

            found++;
        }
    }


    if(found===4){

        status.textContent =
            "Калібрування OK";

    }else{

        status.textContent =
            "Калібрування "+found+"/4";
    }
}


/* ======================================
   4-ТОЧКОВЕ ПЕРСПЕКТИВНЕ ПЕРЕТВОРЕННЯ
====================================== */

/*
   Знаходимо коефіцієнти,
   щоб камера -> екран
   використовувала всі 4 кути.
*/

function getHomography(src,dst){

    let A=[];
    let B=[];


    for(let i=0;i<4;i++){

        let x=src[i].x;
        let y=src[i].y;

        let X=dst[i].x;
        let Y=dst[i].y;


        A.push([
            x,y,1,
            0,0,0,
            -x*X,-y*X
        ]);

        B.push(X);


        A.push([
            0,0,0,
            x,y,1,
            -x*Y,-y*Y
        ]);

        B.push(Y);
    }


    /* Гаусове виключення */

    for(let i=0;i<8;i++){

        let max=i;

        for(
            let j=i+1;
            j<8;
            j++
        ){

            if(
                Math.abs(A[j][i]) >
                Math.abs(A[max][i])
            ){
                max=j;
            }
        }


        [A[i],A[max]] =
        [A[max],A[i]];


        [B[i],B[max]] =
        [B[max],B[i]];


        let div=A[i][i];


        if(Math.abs(div)<1e-10)
            return null;


        for(
            let j=i;
            j<8;
            j++
        ){

            A[i][j]/=div;
        }

        B[i]/=div;


        for(
            let k=0;
            k<8;
            k++
        ){

            if(k===i)
                continue;


            let f=A[k][i];


            for(
                let j=i;
                j<8;
                j++
            ){

                A[k][j]-=
                    f*A[i][j];
            }

            B[k]-=
                f*B[i];
        }
    }


    return [
        B[0],
        B[1],
        B[2],
        B[3],
        B[4],
        B[5],
        B[6],
        B[7],
        1
    ];
}


/* ======================================
   ПОШУК ЛАЗЕРА
====================================== */

function findLaser(){

    if(!cameraReady)
        return null;


    const W=640;
    const H=480;


    scan.width=W;
    scan.height=H;


    sctx.drawImage(
        video,
        0,
        0,
        W,
        H
    );


    const image =
        sctx.getImageData(
            0,
            0,
            W,
            H
        );


    const data =
        image.data;


    /*
       Не просто шукаємо червоний.

       Шукаємо найбільш яскраву
       насичену червону пляму.
    */

    let bestX=0;
    let bestY=0;

    let bestScore=0;


    for(
        let y=0;
        y<H;
        y+=2
    ){

        for(
            let x=0;
            x<W;
            x+=2
        ){

            const i =
                (y*W+x)*4;


            const r=data[i];
            const g=data[i+1];
            const b=data[i+2];


            /*
               Наскільки червоний
            */

            const red =
                r -
                (g+b)/2;


            /*
               Яскравість
            */

            const brightness=r;


            /*
               Потрібне сильне
               червоне переважання
            */

            if(
                r<130 ||
                red<45 ||
                r<g*1.35 ||
                r<b*1.35
            ){
                continue;
            }


            /*
               Чим яскравіший
               і червоніший —
               тим більший score.
            */

            const score =
                red*2 +
                brightness;


            if(score>bestScore){

                bestScore=score;

                bestX=x;
                bestY=y;
            }
        }
    }


    /*
       Якщо нічого схожого
       на лазер не знайдено
    */

    if(bestScore<220)
        return null;


    return {
        x:bestX,
        y:bestY
    };
}


/* ======================================
   ПЕРЕТВОРЕННЯ ЛАЗЕРА
====================================== */

function laserToScreen(p){

    if(
        !corners.yellow ||
        !corners.green ||
        !corners.blue ||
        !corners.orange
    ){
        return null;
    }


    const src=[

        corners.yellow,

        corners.green,

        corners.blue,

        corners.orange
    ];


    const dst=[

        {
            x:0,
            y:0
        },

        {
            x:canvas.width,
            y:0
        },

        {
            x:0,
            y:canvas.height
        },

        {
            x:canvas.width,
            y:canvas.height
        }
    ];


    const H =
        getHomography(
            src,
            dst
        );


    if(!H)
        return null;


    const den =
        H[6]*p.x +
        H[7]*p.y +
        H[8];


    if(Math.abs(den)<0.00001)
        return null;


    const X =
        (
            H[0]*p.x +
            H[1]*p.y +
            H[2]
        ) / den;


    const Y =
        (
            H[3]*p.x +
            H[4]*p.y +
            H[5]
        ) / den;


    return {
        x:Math.max(
            0,
            Math.min(
                canvas.width,
                X
            )
        ),

        y:Math.max(
            0,
            Math.min(
                canvas.height,
                Y
            )
        )
    };
}


/* ======================================
   ЛАЗЕР
====================================== */

function processLaser(){

    if(!cameraReady){

        requestAnimationFrame(
            processLaser
        );

        return;
    }


    const laser =
        findLaser();


    if(laser){

        const p =
            laserToScreen(laser);


        if(p){

            /*
               Невелике згладжування,
               щоб точка не тремтіла.
            */

            if(lastLaser){

                p.x =
                    lastLaser.x*0.35 +
                    p.x*0.65;

                p.y =
                    lastLaser.y*0.35 +
                    p.y*0.65;


                ctx.beginPath();

                ctx.moveTo(
                    lastLaser.x,
                    lastLaser.y
                );

                ctx.lineTo(
                    p.x,
                    p.y
                );


                ctx.strokeStyle="white";

                ctx.lineWidth=4;

                ctx.lineCap="round";

                ctx.lineJoin="round";

                ctx.stroke();
            }


            lastLaser=p;
        }

    }else{

        lastLaser=null;
    }


    requestAnimationFrame(
        processLaser
    );
}


/* ======================================
   КАЛІБРУВАННЯ КОЖНІ 5 СЕКУНД
====================================== */

setInterval(
    calibrate,
    5000
);


/* ======================================
   СТАРТ
====================================== */

startCamera();

processLaser();

</script>

</body>
</html>
