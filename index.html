<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laser Draw</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #24113d;
}

/* Полотно малювання */
#canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 2;
}

/* Камера прихована */
#video {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

/* Чотири калібрувальні точки */
.dot {
    position: fixed;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    z-index: 10;
}

/* Верхній лівий */
#yellow {
    left: 5%;
    top: 5%;
    background: #ffff00;
    box-shadow: 0 0 18px #ffff00;
}

/* Верхній правий */
#green {
    right: 5%;
    top: 5%;
    background: #00ff00;
    box-shadow: 0 0 18px #00ff00;
}

/* Нижній лівий */
#blue {
    left: 5%;
    bottom: 5%;
    background: #0066ff;
    box-shadow: 0 0 18px #0066ff;
}

/* Нижній правий */
#orange {
    right: 5%;
    bottom: 5%;
    background: #ff8800;
    box-shadow: 0 0 18px #ff8800;
}

/* Кнопка камери */
#cameraButton {
    position: fixed;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 23px;
    z-index: 20;
}

#status {
    position: fixed;
    left: 50%;
    top: 12px;
    transform: translateX(-50%);
    color: white;
    background: rgba(0,0,0,0.4);
    padding: 7px 12px;
    border-radius: 10px;
    font-family: Arial;
    font-size: 14px;
    z-index: 20;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<canvas id="scan"></canvas>
<canvas id="canvas"></canvas>

<!-- КАЛІБРУВАЛЬНІ ТОЧКИ -->
<div id="yellow" class="dot"></div>
<div id="green" class="dot"></div>
<div id="blue" class="dot"></div>
<div id="orange" class="dot"></div>

<button id="cameraButton">📷</button>

<div id="status">Запуск камери...</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scan = document.getElementById("scan");
const sctx = scan.getContext("2d", {
    willReadFrequently: true
});

const status = document.getElementById("status");

let cameraReady = false;

/*
    Тут зберігаються реальні координати
    чотирьох кольорових точок,
    які бачить камера.
*/
let corners = {
    yellow: null,
    green: null,
    blue: null,
    orange: null
};

let lastLaser = null;


/* Розмір полотна */
function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* Запуск камери */
async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "environment",
                    width: {
                        ideal: 1280
                    },
                    height: {
                        ideal: 720
                    }
                },

                audio: false
            });

        video.srcObject = stream;

        await video.play();

        cameraReady = true;

        status.textContent =
            "Камера працює";

        setTimeout(calibrate, 1000);

    } catch (error) {

        console.log(error);

        status.textContent =
            "Дозволь доступ до камери";

    }
}


/*
    Визначення кольорової точки
*/
function findColor(type) {

    if (!cameraReady) return null;

    const W = 640;
    const H = 480;

    scan.width = W;
    scan.height = H;

    sctx.drawImage(video, 0, 0, W, H);

    const img =
        sctx.getImageData(0, 0, W, H);

    const data = img.data;

    let sumX = 0;
    let sumY = 0;
    let count = 0;

    for (let y = 0; y < H; y += 2) {

        for (let x = 0; x < W; x += 2) {

            const i = (y * W + x) * 4;

            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            let ok = false;


            /* ЖОВТИЙ */
            if (type === "yellow") {

                ok =
                    r > 170 &&
                    g > 170 &&
                    b < 140 &&
                    r > b * 1.4 &&
                    g > b * 1.4;
            }


            /* ЗЕЛЕНИЙ */
            if (type === "green") {

                ok =
                    g > 130 &&
                    g > r * 1.35 &&
                    g > b * 1.25;
            }


            /* СИНІЙ */
            if (type === "blue") {

                ok =
                    b > 130 &&
                    b > r * 1.35 &&
                    b > g * 1.15;
            }


            /* ПОМАРАНЧЕВИЙ */
            if (type === "orange") {

                ok =
                    r > 160 &&
                    g > 60 &&
                    g < 190 &&
                    b < 110 &&
                    r > g * 1.25;
            }


            /* ЧЕРВОНИЙ ЛАЗЕР */
            if (type === "red") {

                ok =
                    r > 170 &&
                    r > g * 1.7 &&
                    r > b * 1.7 &&
                    g < 130 &&
                    b < 130;
            }


            if (ok) {

                sumX += x;
                sumY += y;
                count++;
            }
        }
    }

    /*
        Мінімальна кількість пікселів,
        щоб випадковий шум не вважався точкою.
    */
    if (count < 8) {
        return null;
    }

    return {
        x: sumX / count,
        y: sumY / count,
        size: count
    };
}


/*
    КАЛІБРУВАННЯ

    Камера шукає всі 4 точки.
*/
function calibrate() {

    if (!cameraReady) return;

    status.textContent =
        "Калібрування...";

    const colors = [
        "yellow",
        "green",
        "blue",
        "orange"
    ];

    let found = 0;

    for (const color of colors) {

        const point = findColor(color);

        if (point) {

            corners[color] = {
                x: point.x,
                y: point.y
            };

            found++;
        }
    }

    if (found === 4) {

        status.textContent =
            "Калібрування OK • лазер можна водити";

    } else {

        status.textContent =
            "Калібрування: " +
            found +
            "/4";
    }
}


/*
    ПЕРЕТВОРЕННЯ КООРДИНАТ

    Камера бачить лазер у своїх координатах.
    Тут переносимо його на екран.
*/
function laserToScreen(p) {

    if (
        !corners.yellow ||
        !corners.green ||
        !corners.blue ||
        !corners.orange
    ) {
        return null;
    }


    /*
        Ліва і права межі
    */

    const left =
        (corners.yellow.x +
         corners.blue.x) / 2;

    const right =
        (corners.green.x +
         corners.orange.x) / 2;


    /*
        Верхня і нижня межі
    */

    const top =
        (corners.yellow.y +
         corners.green.y) / 2;

    const bottom =
        (corners.blue.y +
         corners.orange.y) / 2;


    /*
        Переводимо координати
        у діапазон 0...1
    */

    let x =
        (p.x - left) /
        (right - left);

    let y =
        (p.y - top) /
        (bottom - top);


    /*
        Не дозволяємо вийти
        за межі екрана
    */

    x = Math.max(0, Math.min(1, x));
    y = Math.max(0, Math.min(1, y));


    return {
        x: x * canvas.width,
        y: y * canvas.height
    };
}


/*
    ПОШУК ЛАЗЕРА
*/
function processLaser() {

    if (!cameraReady) {

        requestAnimationFrame(processLaser);

        return;
    }


    const laser =
        findColor("red");


    if (laser) {

        const screenPoint =
            laserToScreen(laser);


        if (screenPoint) {

            /*
                Якщо лазер рухається —
                малюємо лінію.
            */

            if (lastLaser) {

                ctx.beginPath();

                ctx.moveTo(
                    lastLaser.x,
                    lastLaser.y
                );

                ctx.lineTo(
                    screenPoint.x,
                    screenPoint.y
                );

                ctx.strokeStyle = "white";

                ctx.lineWidth = 5;

                ctx.lineCap = "round";

                ctx.lineJoin = "round";

                ctx.stroke();
            }


            lastLaser = screenPoint;
        }

    } else {

        /*
            Лазер зник —
            наступна поява починає
            нову лінію.
        */

        lastLaser = null;
    }


    requestAnimationFrame(processLaser);
}


/*
    Кнопка камери
*/
document
    .getElementById("cameraButton")
    .addEventListener("click", () => {

        if (!cameraReady) {
            startCamera();
        }

    });


/*
    КАЛІБРУВАННЯ КОЖНІ 5 СЕКУНД
*/
setInterval(() => {

    if (cameraReady) {
        calibrate();
    }

}, 5000);


/*
    ЗАПУСК
*/
startCamera();

processLaser();

</script>

</body>
</html>
