<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Laser Projector</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#24113d;
}

body{
    position:relative;
    font-family:Arial,sans-serif;
}

/* Полотно для малювання */
#draw{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

/* Калібрувальні точки */
.dot{
    position:fixed;
    width:22px;
    height:22px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:5;
    pointer-events:none;
}

#yellow{
    left:4%;
    top:4%;
    background:#ffff00;
}

#green{
    left:96%;
    top:4%;
    background:#00ff30;
}

#blue{
    left:4%;
    top:96%;
    background:#008cff;
}

#orange{
    left:96%;
    top:96%;
    background:#ff9800;
}

/* Кнопка камери */
#cameraButton{
    position:fixed;
    right:12px;
    top:12px;
    z-index:100;

    width:48px;
    height:48px;

    border:0;
    border-radius:50%;

    background:rgba(0,0,0,.65);
    color:white;

    font-size:24px;
}

/*
   ВАЖЛИВО:
   відео повністю приховане.
   Воно НЕ займає місце на екрані.
*/
#video{
    position:fixed;
    width:1px;
    height:1px;
    left:-100px;
    top:-100px;
    opacity:0;
    pointer-events:none;
}

/* Прев'ю показується ТІЛЬКИ кнопкою */
#preview{
    position:fixed;
    right:12px;
    top:70px;

    width:240px;
    height:180px;

    object-fit:cover;

    background:#000;

    z-index:99;

    display:none;

    border:2px solid white;
    border-radius:8px;
}

/* Статус */
#status{
    position:fixed;
    left:10px;
    bottom:10px;

    z-index:20;

    color:white;
    background:rgba(0,0,0,.5);

    padding:6px 10px;
    border-radius:8px;

    font-size:13px;
}
</style>
</head>

<body>

<!-- Камера. Завжди прихована -->
<video id="video"
       autoplay
       playsinline
       muted></video>

<!-- Це відео показується ТІЛЬКИ після натискання 📷 -->
<video id="preview"
       autoplay
       playsinline
       muted></video>

<!-- Прихований аналіз камери -->
<canvas id="analysis"></canvas>

<!-- Малювання -->
<canvas id="draw"></canvas>

<!-- 4 калібрувальні точки -->
<div id="yellow" class="dot"></div>
<div id="green" class="dot"></div>
<div id="blue" class="dot"></div>
<div id="orange" class="dot"></div>

<!-- Кнопка -->
<button id="cameraButton">📷</button>

<div id="status">Запуск камери...</div>

<script>

const video =
    document.getElementById("video");

const preview =
    document.getElementById("preview");

const analysis =
    document.getElementById("analysis");

const draw =
    document.getElementById("draw");

const actx =
    analysis.getContext("2d",{
        willReadFrequently:true
    });

const dctx =
    draw.getContext("2d");

const status =
    document.getElementById("status");

let W=640;
let H=480;

let cameraReady=false;

let calibration=null;

let lastCalibration=0;

let lastLaser=null;

let previewVisible=false;


/* =================================================
   РОЗМІР ЕКРАНА
================================================= */

function resize(){

    draw.width=
        window.innerWidth;

    draw.height=
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =================================================
   КАМЕРА
================================================= */

async function startCamera(){

    try{

        const stream=
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false
            });

        video.srcObject=stream;

        await video.play();

        W=
            video.videoWidth ||
            1280;

        H=
            video.videoHeight ||
            720;

        analysis.width=W;
        analysis.height=H;

        cameraReady=true;

        status.textContent=
            "Камера готова";

        requestAnimationFrame(
            mainLoop
        );

    }catch(error){

        console.error(error);

        status.textContent=
            "Немає доступу до камери";
    }
}


/* =================================================
   КНОПКА 📷
================================================= */

document
.getElementById("cameraButton")
.addEventListener("click",()=>{

    previewVisible=
        !previewVisible;

    if(previewVisible){

        /*
           Показуємо той самий потік,
           який вже працює приховано.
        */

        preview.srcObject=
            video.srcObject;

        preview.style.display=
            "block";

    }else{

        /*
           ВАЖЛИВО:
           лише ховаємо відео.
           Камера НЕ вимикається.
        */

        preview.style.display=
            "none";

        preview.srcObject=null;
    }
});


/* =================================================
   КООРДИНАТИ ТОЧКИ НА ЕКРАНІ
================================================= */

function getScreenPoint(id){

    const el=
        document.getElementById(id);

    const r=
        el.getBoundingClientRect();

    return{
        x:r.left+r.width/2,
        y:r.top+r.height/2
    };
}


/* =================================================
   ПОШУК КАЛІБРУВАЛЬНИХ КОЛЬОРІВ
================================================= */

function findColor(type){

    const image=
        actx.getImageData(
            0,
            0,
            W,
            H
        );

    const data=image.data;

    let bestScore=0;
    let bestX=0;
    let bestY=0;

    for(let y=0;y<H;y+=2){

        for(let x=0;x<W;x+=2){

            const i=
                (y*W+x)*4;

            const r=data[i];
            const g=data[i+1];
            const b=data[i+2];

            let score=0;


            /* ЖОВТИЙ */

            if(type==="yellow"){

                if(
                    r>150 &&
                    g>150 &&
                    b<120 &&
                    r>b*1.5 &&
                    g>b*1.5
                ){

                    score=
                        r+g-b;
                }
            }


            /* ЗЕЛЕНИЙ */

            if(type==="green"){

                if(
                    g>130 &&
                    g>r*1.25 &&
                    g>b*1.15
                ){

                    score=
                        g*2-r-b;
                }
            }


            /* СИНІЙ */

            if(type==="blue"){

                if(
                    b>120 &&
                    b>r*1.25 &&
                    b>g*1.15
                ){

                    score=
                        b*2-r-g;
                }
            }


            /* ПОМАРАНЧЕВИЙ */

            if(type==="orange"){

                if(
                    r>160 &&
                    g>70 &&
                    g<190 &&
                    b<100 &&
                    r>g*1.25 &&
                    g>b*1.4
                ){

                    score=
                        r*2+g-b*2;
                }
            }


            if(score>bestScore){

                bestScore=score;

                bestX=x;
                bestY=y;
            }
        }
    }

    if(bestScore<=0)
        return null;

    return{
        x:bestX,
        y:bestY,
        score:bestScore
    };
}


/* =================================================
   HOMOGRAPHY
================================================= */

function computeHomography(src,dst){

    let A=[];
    let B=[];

    for(let i=0;i<4;i++){

        const x=src[i].x;
        const y=src[i].y;

        const X=dst[i].x;
        const Y=dst[i].y;

        A.push([
            x,y,1,
            0,0,0,
            -X*x,
            -X*y
        ]);

        B.push(X);

        A.push([
            0,0,0,
            x,y,1,
            -Y*x,
            -Y*y
        ]);

        B.push(Y);
    }

    const n=8;

    for(let i=0;i<n;i++){

        let maxRow=i;

        for(
            let j=i+1;
            j<n;
            j++
        ){

            if(
                Math.abs(A[j][i]) >
                Math.abs(A[maxRow][i])
            ){

                maxRow=j;
            }
        }

        if(
            Math.abs(A[maxRow][i])
            <0.0000001
        ){

            return null;
        }

        [A[i],A[maxRow]]=
            [A[maxRow],A[i]];

        [B[i],B[maxRow]]=
            [B[maxRow],B[i]];

        const div=A[i][i];

        for(
            let j=i;
            j<n;
            j++
        ){

            A[i][j]/=div;
        }

        B[i]/=div;

        for(
            let k=0;
            k<n;
            k++
        ){

            if(k===i)
                continue;

            const factor=
                A[k][i];

            for(
                let j=i;
                j<n;
                j++
            ){

                A[k][j]
                    -=factor*A[i][j];
            }

            B[k]
                -=factor*B[i];
        }
    }

    return[
        B[0],
        B[1],
        B[2],
        B[3],
        B[4],
        B[5],
        B[6],
        B[7],
        1
    ];
}


/* =================================================
   КАЛІБРУВАННЯ
================================================= */

function calibrate(){

    if(!cameraReady)
        return;

    actx.drawImage(
        video,
        0,
        0,
        W,
        H
    );

    const yellow=
        findColor("yellow");

    const green=
        findColor("green");

    const blue=
        findColor("blue");

    const orange=
        findColor("orange");


    if(
        !yellow||
        !green||
        !blue||
        !orange
    ){

        status.textContent=
            "Шукаю 4 калібрувальні точки";

        return;
    }


    const src=[
        yellow,
        green,
        blue,
        orange
    ];


    const dst=[
        getScreenPoint("yellow"),
        getScreenPoint("green"),
        getScreenPoint("blue"),
        getScreenPoint("orange")
    ];


    const Hmat=
        computeHomography(
            src,
            dst
        );


    if(!Hmat){

        status.textContent=
            "Помилка калібрування";

        return;
    }


    calibration=Hmat;

    lastCalibration=
        performance.now();

    status.textContent=
        "Калібрування готове";
}


/* =================================================
   ЧИ БІЛЯ КАЛІБРУВАЛЬНОЇ ТОЧКИ
================================================= */

function isNearCalibrationPoint(x,y){

    const colors=[
        "yellow",
        "green",
        "blue",
        "orange"
    ];

    const radius=
        Math.min(W,H)*0.075;

    for(
        const color of colors
    ){

        const p=
            findColor(color);

        if(!p)
            continue;

        const dx=x-p.x;
        const dy=y-p.y;

        if(
            dx*dx+
            dy*dy<
            radius*radius
        ){

            return true;
        }
    }

    return false;
}


/* =================================================
   ПОШУК ЛАЗЕРА
================================================= */

function findLaser(){

    const image=
        actx.getImageData(
            0,
            0,
            W,
            H
        );

    const data=image.data;

    let bestScore=0;
    let bestX=-1;
    let bestY=-1;


    /*
       Кожен піксель.
       Це важливо, бо лазер дуже маленький.
    */

    for(
        let y=1;
        y<H-1;
        y++
    ){

        for(
            let x=1;
            x<W-1;
            x++
        ){

            const i=
                (y*W+x)*4;

            const r=data[i];
            const g=data[i+1];
            const b=data[i+2];


            /*
               Сильний червоний.
            */

            if(r<130)
                continue;

            if(r-g<65)
                continue;

            if(r-b<65)
                continue;


            /*
               Локальна яскравість.
            */

            const left=
                (y*W+x-1)*4;

            const right=
                (y*W+x+1)*4;

            const up=
                ((y-1)*W+x)*4;

            const down=
                ((y+1)*W+x)*4;


            const neighbourR=
                (
                    data[left]+
                    data[right]+
                    data[up]+
                    data[down]
                )/4;


            const contrast=
                r-neighbourR;


            if(contrast<8)
                continue;


            /*
               Перевіряємо маленьку область.
            */

            let redPixels=0;
            let totalRed=0;


            for(
                let yy=Math.max(0,y-3);
                yy<=Math.min(H-1,y+3);
                yy++
            ){

                for(
                    let xx=Math.max(0,x-3);
                    xx<=Math.min(W-1,x+3);
                    xx++
                ){

                    const q=
                        (yy*W+xx)*4;

                    const rr=data[q];
                    const gg=data[q+1];
                    const bb=data[q+2];


                    if(
                        rr>100 &&
                        rr-gg>45 &&
                        rr-bb>45
                    ){

                        redPixels++;

                        totalRed+=
                            rr-
                            (gg+bb)/2;
                    }
                }
            }


            /*
               Помаранчева велика пляма
               не повинна пройти.
            */

            if(redPixels>45)
                continue;


            let score=
                (r-g)*1.8+
                (r-b)*1.8+
                contrast*4+
                r*.3+
                totalRed*1.5;


            /*
               Не беремо калібрувальні точки.
            */

            if(
                isNearCalibrationPoint(
                    x,
                    y
                )
            ){

                continue;
            }


            if(score>bestScore){

                bestScore=score;

                bestX=x;
                bestY=y;
            }
        }
    }


    if(bestX<0)
        return null;


    /*
       Центр лазерної плями.
    */

    let sumX=0;
    let sumY=0;
    let sumWeight=0;


    for(
        let y=Math.max(0,bestY-5);
        y<=Math.min(H-1,bestY+5);
        y++
    ){

        for(
            let x=Math.max(0,bestX-5);
            x<=Math.min(W-1,bestX+5);
            x++
        ){

            const i=
                (y*W+x)*4;

            const r=data[i];
            const g=data[i+1];
            const b=data[i+2];


            const red=
                r-Math.max(g,b);


            if(
                red>50 &&
                r>110
            ){

                const weight=
                    red*red;

                sumX+=x*weight;
                sumY+=y*weight;

                sumWeight+=weight;
            }
        }
    }


    if(sumWeight===0)
        return null;


    return{
        x:sumX/sumWeight,
        y:sumY/sumWeight
    };
}


/* =================================================
   КАМЕРА → ЕКРАН
================================================= */

function laserToScreen(p){

    if(!calibration)
        return null;

    const h=calibration;


    const denominator=
        h[6]*p.x+
        h[7]*p.y+
        1;


    if(
        Math.abs(denominator)
        <0.000001
    ){

        return null;
    }


    return{

        x:
        (
            h[0]*p.x+
            h[1]*p.y+
            h[2]
        )/denominator,

        y:
        (
            h[3]*p.x+
            h[4]*p.y+
            h[5]
        )/denominator
    };
}


/* =================================================
   ГОЛОВНИЙ ЦИКЛ
================================================= */

function mainLoop(){

    if(!cameraReady)
        return;


    /*
       Нове калібрування кожні 5 секунд.
    */

    if(
        !calibration||
        performance.now()-
        lastCalibration>5000
    ){

        calibrate();
    }


    /*
       Аналіз камери.
       Саме відео при цьому НЕ показується.
    */

    actx.drawImage(
        video,
        0,
        0,
        W,
        H
    );


    const laser=
        findLaser();


    if(laser){

        const screen=
            laserToScreen(laser);


        if(screen){

            /*
               Плавність.
            */

            if(lastLaser){

                screen.x=
                    lastLaser.x*.25+
                    screen.x*.75;

                screen.y=
                    lastLaser.y*.25+
                    screen.y*.75;
            }


            if(
                screen.x>=0 &&
                screen.x<=window.innerWidth &&
                screen.y>=0 &&
                screen.y<=window.innerHeight
            ){

                if(lastLaser){

                    dctx.beginPath();

                    dctx.moveTo(
                        lastLaser.x,
                        lastLaser.y
                    );

                    dctx.lineTo(
                        screen.x,
                        screen.y
                    );

                    dctx.strokeStyle=
                        "white";

                    dctx.lineWidth=4;

                    dctx.lineCap=
                        "round";

                    dctx.stroke();
                }


                lastLaser=screen;

                status.textContent=
                    "🔴 Лазер знайдено";
            }
        }

    }else{

        status.textContent=
            calibration
            ? "Калібрування OK • шукаю лазер"
            : "Калібрування...";
    }


    requestAnimationFrame(
        mainLoop
    );
}


/* =================================================
   ЗАПУСК
================================================= */

startCamera();

</script>

</body>
      </html>
