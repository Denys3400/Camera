<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laser Draw</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

/* Камера працює, але відео НЕ видно */
video{
  position:fixed;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

#buttons{
  position:fixed;
  top:10px;
  left:10px;
  z-index:10;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{
  padding:10px 14px;
  font-size:16px;
  border:0;
  border-radius:10px;
}

#info{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:#000b;
  color:white;
  padding:10px 15px;
  border-radius:10px;
  z-index:10;
  text-align:center;
}

.point{
  position:fixed;
  width:28px;
  height:28px;
  margin:-14px;
  border-radius:50%;
  background:#00ffff;
  box-shadow:0 0 20px #00ffff;
  z-index:8;
}

#p1{left:5%;top:5%}
#p2{right:5%;top:5%}
#p3{right:5%;bottom:5%}
#p4{left:5%;bottom:5%}

.hidden{
  display:none;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<canvas id="draw"></canvas>
<canvas id="scan" width="320" height="240" hidden></canvas>

<div id="buttons">
<button onclick="startCamera()">📷 Камера</button>
<button onclick="calibrate()">🎯 Калібрування</button>
<button onclick="clearDraw()">🗑 Очистити</button>
</div>

<div id="info">
Спочатку увімкни камеру
</div>

<div id="p1" class="point hidden"></div>
<div id="p2" class="point hidden"></div>
<div id="p3" class="point hidden"></div>
<div id="p4" class="point hidden"></div>

<script>

const camera=document.getElementById("camera");
const draw=document.getElementById("draw");
const ctx=draw.getContext("2d");

const scan=document.getElementById("scan");
const sctx=scan.getContext("2d");

const info=document.getElementById("info");

let cameraRunning=false;
let calibrated=false;

let corners={
  tl:null,
  tr:null,
  br:null,
  bl:null
};

let lastX=null;
let lastY=null;


/* Розмір малювання */

function resize(){

  draw.width=innerWidth;
  draw.height=innerHeight;

  ctx.lineWidth=5;
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.strokeStyle="red";
}

resize();

window.addEventListener("resize",resize);


/* Увімкнення камери */

async function startCamera(){

  try{

    const stream=await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      },

      audio:false

    });

    camera.srcObject=stream;

    cameraRunning=true;

    info.textContent=
      "Камера працює. Натисни 🎯 Калібрування";

    camera.onloadedmetadata=()=>{

      camera.play();

    };

  }catch(error){

    info.textContent=
      "❌ Немає доступу до камери";

    alert(
      "Дозволь Chrome доступ до камери."
    );

  }

}


/* Показати 4 точки */

function showPoints(){

  document.querySelectorAll(".point")
    .forEach(p=>{
      p.classList.remove("hidden");
    });

}


/* Сховати 4 точки */

function hidePoints(){

  document.querySelectorAll(".point")
    .forEach(p=>{
      p.classList.add("hidden");
    });

}


/* Калібрування */

async function calibrate(){

  if(!cameraRunning){

    alert(
      "Спочатку натисни 📷 Камера"
    );

    return;

  }

  calibrated=false;

  lastX=null;
  lastY=null;

  showPoints();

  info.textContent=
    "Наведи лазер на верхню ліву 🔵 точку";

  corners.tl=await waitForLaser("tl");

  info.textContent=
    "Наведи лазер на верхню праву 🔵 точку";

  corners.tr=await waitForLaser("tr");

  info.textContent=
    "Наведи лазер на нижню праву 🔵 точку";

  corners.br=await waitForLaser("br");

  info.textContent=
    "Наведи лазер на нижню ліву 🔵 точку";

  corners.bl=await waitForLaser("bl");

  calibrated=true;

  hidePoints();

  info.textContent=
    "✅ Готово! Тепер малюй лазером 🔴";

}


/* Очікування лазера */

function waitForLaser(name){

  return new Promise(resolve=>{

    const timer=setInterval(()=>{

      const laser=findLaser();

      if(!laser)return;

      const target=getTarget(name);

      const distance=Math.hypot(
        laser.x-target.x,
        laser.y-target.y
      );

      if(distance<80){

        clearInterval(timer);

        resolve({
          x:laser.x,
          y:laser.y
        });

      }

    },80);

  });

}


/* Координати блакитних точок */

function getTarget(name){

  const m=0.05;

  if(name==="tl"){

    return {
      x:innerWidth*m,
      y:innerHeight*m
    };

  }

  if(name==="tr"){

    return {
      x:innerWidth*(1-m),
      y:innerHeight*m
    };

  }

  if(name==="br"){

    return {
      x:innerWidth*(1-m),
      y:innerHeight*(1-m)
    };

  }

  return {
    x:innerWidth*m,
    y:innerHeight*(1-m)
  };

}


/* Пошук червоної точки лазера */

function findLaser(){

  if(camera.readyState<2)
    return null;

  const W=320;
  const H=240;

  sctx.drawImage(
    camera,
    0,
    0,
    W,
    H
  );

  const pixels=sctx.getImageData(
    0,
    0,
    W,
    H
  ).data;

  let totalX=0;
  let totalY=0;
  let count=0;

  for(let y=0;y<H;y++){

    for(let x=0;x<W;x++){

      const i=(y*W+x)*4;

      const r=pixels[i];
      const g=pixels[i+1];
      const b=pixels[i+2];

      /*
        Шукаємо яскраво-червоний лазер
      */

      if(
        r>180 &&
        r>g*1.6 &&
        r>b*1.6 &&
        r-g>60
      ){

        totalX+=x;
        totalY+=y;
        count++;

      }

    }

  }

  if(count<2)
    return null;

  return {

    x:(totalX/count)/W*innerWidth,

    y:(totalY/count)/H*innerHeight

  };

}


/* Перетворення координат */

function transformPoint(p){

  const tl=corners.tl;
  const tr=corners.tr;
  const br=corners.br;
  const bl=corners.bl;

  /*
    Нормалізація відносно
    чотирьох точок.
  */

  const topWidth=Math.hypot(
    tr.x-tl.x,
    tr.y-tl.y
  );

  const bottomWidth=Math.hypot(
    br.x-bl.x,
    br.y-bl.y
  );

  const leftHeight=Math.hypot(
    bl.x-tl.x,
    bl.y-tl.y
  );

  const rightHeight=Math.hypot(
    br.x-tr.x,
    br.y-tr.y
  );

  const minX=Math.min(
    tl.x,
    bl.x
  );

  const maxX=Math.max(
    tr.x,
    br.x
  );

  const minY=Math.min(
    tl.y,
    tr.y
  );

  const maxY=Math.max(
    bl.y,
    br.y
  );

  let nx=
    (p.x-minX)/
    Math.max(1,maxX-minX);

  let ny=
    (p.y-minY)/
    Math.max(1,maxY-minY);

  nx=Math.max(0,Math.min(1,nx));
  ny=Math.max(0,Math.min(1,ny));

  return {
    x:nx*innerWidth,
    y:ny*innerHeight
  };

}


/* Малювання лазером */

function scanLaser(){

  if(cameraRunning){

    const laser=findLaser();

    if(laser && calibrated){

      const p=transformPoint(laser);

      if(lastX!==null){

        const distance=Math.hypot(
          p.x-lastX,
          p.y-lastY
        );

        if(distance<100){

          ctx.beginPath();

          ctx.moveTo(
            lastX,
            lastY
          );

          ctx.lineTo(
            p.x,
            p.y
          );

          ctx.stroke();

        }

      }

      lastX=p.x;
      lastY=p.y;

    }else{

      lastX=null;
      lastY=null;

    }

  }

  requestAnimationFrame(scanLaser);

}


/* Очистити малюнок */

function clearDraw(){

  ctx.clearRect(
    0,
    0,
    draw.width,
    draw.height
  );

  lastX=null;
  lastY=null;

}


/* Запускаємо пошук лазера */

requestAnimationFrame(scanLaser);

</script>

</body>
</html>
