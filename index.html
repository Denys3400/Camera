<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Laser Draw</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#24113d;
}

/* Камера працює, але її відео невидиме */

video{
    position:fixed;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
}

/* Полотно для малювання */

#draw{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
}

/* Сканер камери */

#scan{
    display:none;
}

/* Маленька кнопка збоку */

#menu{
    position:fixed;
    left:10px;
    top:10px;
    z-index:20;
}

button{
    border:0;
    border-radius:50%;
    width:42px;
    height:42px;
    font-size:20px;
}

/* Інформація */

#info{
    position:fixed;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);

    background:#12091f;
    color:white;

    padding:8px 14px;
    border-radius:10px;

    font-family:Arial;
    font-size:15px;

    z-index:20;
}

/* Калібрувальні точки */

.point{
    position:fixed;

    width:32px;
    height:32px;

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:15;

    box-shadow:
        0 0 12px currentColor,
        0 0 25px currentColor;

    display:none;
}

/* Жовта — верхній лівий */

#yellow{
    left:5%;
    top:5%;
    background:#ffff00;
    color:#ffff00;
}

/* Зелена — верхній правий */

#green{
    left:95%;
    top:5%;
    background:#00ff40;
    color:#00ff40;
}

/* Синя — нижній лівий */

#blue{
    left:5%;
    top:95%;
    background:#008cff;
    color:#008cff;
}

/* Помаранчева — нижній правий */

#orange{
    left:95%;
    top:95%;
    background:#ff8c00;
    color:#ff8c00;
}

</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<canvas id="draw"></canvas>

<canvas id="scan" width="320" height="240"></canvas>

<div id="menu">
    <button onclick="startCamera()">📷</button>
</div>

<div id="info">
    Натисни 📷
</div>


<!-- 4 точки -->

<div id="yellow" class="point"></div>
<div id="green" class="point"></div>
<div id="blue" class="point"></div>
<div id="orange" class="point"></div>


<script>

const camera =
    document.getElementById("camera");

const draw =
    document.getElementById("draw");

const ctx =
    draw.getContext("2d");

const scan =
    document.getElementById("scan");

const sctx =
    scan.getContext(
        "2d",
        {willReadFrequently:true}
    );

const info =
    document.getElementById("info");


let running=false;

let calibrated=false;

let corners={
    tl:null,
    tr:null,
    bl:null,
    br:null
};

let lastX=null;
let lastY=null;


/* Розмір полотна */

function resize(){

    draw.width=innerWidth;
    draw.height=innerHeight;

    ctx.lineWidth=5;
    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.strokeStyle="#ffffff";
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* Запуск камери */

async function startCamera(){

    try{

        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false
            });

        camera.srcObject=stream;

        running=true;

        info.textContent=
            "Камера працює";

        camera.onloadedmetadata=()=>{

            camera.play();

            setTimeout(
                automaticCalibration,
                1000
            );

            requestAnimationFrame(
                scanLoop
            );

        };

    }

    catch(error){

        info.textContent=
            "❌ Немає доступу до камери";

        alert(
            "Дозволь Chrome доступ до камери."
        );

    }

}


/* Показати точки */

function showCalibrationPoints(){

    document.querySelectorAll(".point")
        .forEach(p=>{
            p.style.display="block";
        });

}


/* Сховати точки */

function hideCalibrationPoints(){

    document.querySelectorAll(".point")
        .forEach(p=>{
            p.style.display="none";
        });

}


/*
   Пошук кольорової точки.
*/

function findColor(color){

    if(camera.readyState<2)
        return null;

    const W=320;
    const H=240;

    sctx.drawImage(
        camera,
        0,
        0,
        W,
        H
    );

    const data=
        sctx.getImageData(
            0,
            0,
            W,
            H
        ).data;

    let sumX=0;
    let sumY=0;
    let count=0;


    for(
        let y=0;
        y<H;
        y++
    ){

        for(
            let x=0;
            x<W;
            x++
        ){

            const i=
                (y*W+x)*4;

            const r=data[i];
            const g=data[i+1];
            const b=data[i+2];


            let ok=false;


            /*
              ЖОВТИЙ
            */

            if(color==="yellow"){

                ok =
                    r>180 &&
                    g>180 &&
                    b<100;

            }


            /*
              ЗЕЛЕНИЙ
            */

            if(color==="green"){

                ok =
                    g>170 &&
                    g>r*1.4 &&
                    g>b*1.2;

            }


            /*
              СИНІЙ
            */

            if(color==="blue"){

                ok =
                    b>170 &&
                    b>r*1.4 &&
                    b>g*1.2;

            }


            /*
              ПОМАРАНЧЕВИЙ

              Важливо:
              він має багато
              червоного,
              але також багато
              зеленого.
            */

            if(color==="orange"){

                ok =
                    r>180 &&
                    g>70 &&
                    g<190 &&
                    b<80 &&
                    r>g*1.25;

            }


            /*
              ЧЕРВОНИЙ ЛАЗЕР
            */

            if(color==="red"){

                ok =
                    r>190 &&
                    g<100 &&
                    b<100 &&
                    r>g*2 &&
                    r>b*2;

            }


            if(ok){

                sumX+=x;
                sumY+=y;
                count++;

            }

        }

    }


    if(count<3)
        return null;


    return {

        x:
        (sumX/count)/W*
        innerWidth,

        y:
        (sumY/count)/H*
        innerHeight

    };

}


/* Автоматична калібровка */

async function automaticCalibration(){

    if(!running)
        return;


    calibrated=false;

    lastX=null;
    lastY=null;


    showCalibrationPoints();


    info.textContent=
        "🔍 Калібрування...";


    /*
       Чекаємо всі 4 кольори.
    */

    let yellow=null;
    let green=null;
    let blue=null;
    let orange=null;


    /*
       Максимум 2 секунди
       на кожну точку.
    */

    yellow=
        await waitForColor(
            "yellow",
            2000
        );

    green=
        await waitForColor(
            "green",
            2000
        );

    blue=
        await waitForColor(
            "blue",
            2000
        );

    orange=
        await waitForColor(
            "orange",
            2000
        );


    if(
        yellow &&
        green &&
        blue &&
        orange
    ){

        corners.tl=yellow;
        corners.tr=green;
        corners.bl=blue;
        corners.br=orange;

        calibrated=true;

        info.textContent=
            "✅ Екран знайдено";

    }

    else{

        info.textContent=
            "🔍 Не всі точки знайдені";

    }


    hideCalibrationPoints();


    /*
       Наступна калібровка
       через 5 секунд.
    */

    setTimeout(
        automaticCalibration,
        5000
    );

}


/* Очікування кольору */

function waitForColor(
    color,
    timeout
){

    return new Promise(resolve=>{

        const start=
            Date.now();


        const timer=
            setInterval(()=>{

                const p=
                    findColor(color);


                if(p){

                    clearInterval(timer);

                    resolve(p);

                    return;

                }


                if(
                    Date.now()-start>
                    timeout
                ){

                    clearInterval(timer);

                    resolve(null);

                }

            },50);

    });

}


/*
   Пошук червоного лазера
*/

function findLaser(){

    return findColor("red");

}


/*
   Перетворення положення
   лазера всередині 4 кутів.
*/

function transformPoint(p){

    const tl=corners.tl;
    const tr=corners.tr;
    const bl=corners.bl;
    const br=corners.br;


    /*
       Визначаємо межі
       каліброваного екрана.
    */

    const left=
        Math.min(
            tl.x,
            bl.x
        );

    const right=
        Math.max(
            tr.x,
            br.x
        );

    const top=
        Math.min(
            tl.y,
            tr.y
        );

    const bottom=
        Math.max(
            bl.y,
            br.y
        );


    let nx=
        (p.x-left)/
        Math.max(
            1,
            right-left
        );


    let ny=
        (p.y-top)/
        Math.max(
            1,
            bottom-top
        );


    nx=
        Math.max(
            0,
            Math.min(
                1,
                nx
            )
        );


    ny=
        Math.max(
            0,
            Math.min(
                1,
                ny
            )
        );


    return {

        x:nx*innerWidth,

        y:ny*innerHeight

    };

}


/*
   Основний цикл.
*/

function scanLoop(){

    if(
        running &&
        calibrated
    ){

        const laser=
            findLaser();


        if(laser){

            const p=
                transformPoint(
                    laser
                );


            if(lastX!==null){

                const distance=
                    Math.hypot(
                        p.x-lastX,
                        p.y-lastY
                    );


                if(distance<100){

                    ctx.beginPath();

                    ctx.moveTo(
                        lastX,
                        lastY
                    );

                    ctx.lineTo(
                        p.x,
                        p.y
                    );

                    ctx.stroke();

                }

            }


            lastX=p.x;
            lastY=p.y;

        }

        else{

            lastX=null;
            lastY=null;

        }

    }


    requestAnimationFrame(
        scanLoop
    );

}


/* Очистити */

function clearDraw(){

    ctx.clearRect(
        0,
        0,
        draw.width,
        draw.height
    );

    lastX=null;
    lastY=null;

}

</script>

</body>
  </html>
