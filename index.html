<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Laser Projector</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #24113d;
}

body {
    position: relative;
    font-family: Arial, sans-serif;
}

#draw {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.dot {
    position: fixed;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    box-shadow: 0 0 8px rgba(255,255,255,0.35);
}

#yellow {
    left: 4%;
    top: 4%;
    background: #ffff00;
}

#green {
    left: 96%;
    top: 4%;
    background: #00ff30;
}

#blue {
    left: 4%;
    top: 96%;
    background: #008cff;
}

#orange {
    left: 96%;
    top: 96%;
    background: #ff9800;
}

#cameraButton {
    position: fixed;
    right: 12px;
    top: 12px;
    z-index: 20;

    width: 48px;
    height: 48px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,0.65);
    color: white;
    font-size: 24px;
}

#preview {
    position: fixed;
    right: 12px;
    top: 70px;

    width: 240px;
    height: 180px;

    object-fit: cover;
    background: black;

    z-index: 19;

    display: none;

    border: 2px solid white;
    border-radius: 8px;
}

#status {
    position: fixed;
    left: 10px;
    bottom: 10px;

    z-index: 20;

    color: white;
    background: rgba(0,0,0,0.55);

    padding: 6px 10px;
    border-radius: 8px;

    font-size: 13px;
}
</style>
</head>

<body>

<video id="video"
       autoplay
       playsinline
       muted
       style="display:none"></video>

<video id="preview"
       autoplay
       playsinline
       muted></video>

<canvas id="analysis"></canvas>
<canvas id="draw"></canvas>

<div id="yellow" class="dot"></div>
<div id="green" class="dot"></div>
<div id="blue" class="dot"></div>
<div id="orange" class="dot"></div>

<button id="cameraButton">📷</button>

<div id="status">Запуск камери...</div>

<script>

const video = document.getElementById("video");
const preview = document.getElementById("preview");

const analysis = document.getElementById("analysis");
const draw = document.getElementById("draw");

const actx = analysis.getContext("2d", {
    willReadFrequently: true
});

const dctx = draw.getContext("2d");

const status = document.getElementById("status");

let W = 640;
let H = 480;

let cameraReady = false;

let calibration = null;
let lastCalibration = 0;

let lastLaser = null;
let laserVisible = false;

let cameraPreview = false;


/* ---------------------------------------------------
   КАМЕРА
--------------------------------------------------- */

async function startCamera() {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                },
                width: {
                    ideal: 1280
                },
                height: {
                    ideal: 720
                }
            },
            audio: false
        });

        video.srcObject = stream;

        await video.play();

        W = video.videoWidth || 1280;
        H = video.videoHeight || 720;

        analysis.width = W;
        analysis.height = H;

        cameraReady = true;

        status.textContent = "Камера працює";

        requestAnimationFrame(mainLoop);

    } catch (e) {

        console.error(e);

        status.textContent =
            "Не вдалося отримати доступ до камери";

    }
}


/* ---------------------------------------------------
   КНОПКА ПЕРЕГЛЯДУ КАМЕРИ
--------------------------------------------------- */

document.getElementById("cameraButton").onclick = () => {

    cameraPreview = !cameraPreview;

    if (cameraPreview) {

        preview.srcObject = video.srcObject;
        preview.style.display = "block";

    } else {

        preview.style.display = "none";

    }
};


/* ---------------------------------------------------
   ОТРИМАННЯ КООРДИНАТ КАЛІБРУВАЛЬНИХ ТОЧОК
--------------------------------------------------- */

function getScreenPoint(id) {

    const el = document.getElementById(id);

    const r = el.getBoundingClientRect();

    return {
        x: r.left + r.width / 2,
        y: r.top + r.height / 2
    };
}


/* ---------------------------------------------------
   ПОШУК КОЛЬОРОВОЇ ТОЧКИ В КАМЕРІ
--------------------------------------------------- */

function findColor(type) {

    const image = actx.getImageData(0, 0, W, H);
    const data = image.data;

    let bestX = 0;
    let bestY = 0;
    let bestScore = 0;

    /*
      Не скануємо кожен піксель по кілька разів.
      Але для маленького лазера нижче буде окремий
      повний пошук.
    */

    for (let y = 0; y < H; y += 2) {

        for (let x = 0; x < W; x += 2) {

            const i = (y * W + x) * 4;

            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            let score = 0;

            if (type === "yellow") {

                if (
                    r > 150 &&
                    g > 150 &&
                    b < 120 &&
                    r > b * 1.5 &&
                    g > b * 1.5
                ) {
                    score =
                        r + g - b;
                }

            }

            else if (type === "green") {

                if (
                    g > 130 &&
                    g > r * 1.25 &&
                    g > b * 1.15
                ) {
                    score =
                        g * 2 - r - b;
                }

            }

            else if (type === "blue") {

                if (
                    b > 120 &&
                    b > r * 1.25 &&
                    b > g * 1.15
                ) {
                    score =
                        b * 2 - r - g;
                }

            }

            else if (type === "orange") {

                /*
                   Помаранчевий шукаємо окремо.
                   Він НЕ повинен потрапляти в лазер.
                */

                if (
                    r > 160 &&
                    g > 70 &&
                    g < 190 &&
                    b < 100 &&
                    r > g * 1.25 &&
                    g > b * 1.4
                ) {

                    score =
                        r * 2 +
                        g -
                        b * 2;

                }

            }

            if (score > bestScore) {

                bestScore = score;
                bestX = x;
                bestY = y;

            }
        }
    }

    if (bestScore <= 0) {
        return null;
    }

    return {
        x: bestX,
        y: bestY,
        score: bestScore
    };
}


/* ---------------------------------------------------
   КАЛІБРУВАННЯ
--------------------------------------------------- */

function calibrate() {

    if (!cameraReady) return;

    actx.drawImage(video, 0, 0, W, H);

    const yellow = findColor("yellow");
    const green = findColor("green");
    const blue = findColor("blue");
    const orange = findColor("orange");

    if (
        !yellow ||
        !green ||
        !blue ||
        !orange
    ) {

        status.textContent =
            "Калібрування: шукаю 4 точки";

        return;
    }

    /*
       Важливо:

       Камерні координати = де камера побачила точки.

       Екранні координати = де реально знаходяться точки
       на проектованому екрані.

       Тому більше НЕ переводимо їх у самі кути 0/100%.
       Використовуємо справжні центри точок.
    */

    const screenYellow = getScreenPoint("yellow");
    const screenGreen = getScreenPoint("green");
    const screenBlue = getScreenPoint("blue");
    const screenOrange = getScreenPoint("orange");

    const src = [
        yellow,
        green,
        blue,
        orange
    ];

    const dst = [
        screenYellow,
        screenGreen,
        screenBlue,
        screenOrange
    ];

    const Hmat = computeHomography(src, dst);

    if (!Hmat) {

        status.textContent =
            "Помилка калібрування";

        return;
    }

    calibration = Hmat;

    status.textContent =
        "Калібрування готове";

    lastCalibration = performance.now();
}


/* ---------------------------------------------------
   HOMOGRAPHY
--------------------------------------------------- */

function computeHomography(src, dst) {

    let A = [];
    let B = [];

    for (let i = 0; i < 4; i++) {

        const x = src[i].x;
        const y = src[i].y;

        const X = dst[i].x;
        const Y = dst[i].y;

        A.push([
            x, y, 1,
            0, 0, 0,
            -X*x, -X*y
        ]);

        B.push(X);

        A.push([
            0, 0, 0,
            x, y, 1,
            -Y*x, -Y*y
        ]);

        B.push(Y);
    }

    const n = 8;

    for (let i = 0; i < n; i++) {

        let maxRow = i;

        for (let j = i + 1; j < n; j++) {

            if (
                Math.abs(A[j][i]) >
                Math.abs(A[maxRow][i])
            ) {
                maxRow = j;
            }
        }

        if (
            Math.abs(A[maxRow][i]) <
            0.0000001
        ) {
            return null;
        }

        [A[i], A[maxRow]] =
            [A[maxRow], A[i]];

        [B[i], B[maxRow]] =
            [B[maxRow], B[i]];

        const div = A[i][i];

        for (let j = i; j < n; j++) {
            A[i][j] /= div;
        }

        B[i] /= div;

        for (let k = 0; k < n; k++) {

            if (k === i) continue;

            const factor = A[k][i];

            for (let j = i; j < n; j++) {
                A[k][j] -= factor * A[i][j];
            }

            B[k] -= factor * B[i];
        }
    }

    return [
        B[0],
        B[1],
        B[2],
        B[3],
        B[4],
        B[5],
        B[6],
        B[7],
        1
    ];
}


/* ---------------------------------------------------
   ПЕРЕВІРКА: ЧИ НЕ БІЛЯ КАЛІБРУВАЛЬНОЇ ТОЧКИ
--------------------------------------------------- */

function isNearCalibrationPoint(x, y) {

    if (!calibration) return false;

    const points = [
        findColor("yellow"),
        findColor("green"),
        findColor("blue"),
        findColor("orange")
    ];

    const radius = Math.min(W, H) * 0.075;

    for (const p of points) {

        if (!p) continue;

        const dx = x - p.x;
        const dy = y - p.y;

        if (
            dx * dx +
            dy * dy <
            radius * radius
        ) {
            return true;
        }
    }

    return false;
}


/* ---------------------------------------------------
   ПОШУК ЛАЗЕРА
--------------------------------------------------- */

function findLaser() {

    const image =
        actx.getImageData(0, 0, W, H);

    const data = image.data;

    let bestScore = 0;
    let bestX = -1;
    let bestY = -1;

    /*
       ЛАЗЕР ДУЖЕ МАЛЕНЬКИЙ.

       Тому тут скануємо КОЖЕН піксель,
       а не кожен другий.
    */

    for (let y = 1; y < H - 1; y++) {

        for (let x = 1; x < W - 1; x++) {

            const i = (y * W + x) * 4;

            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            /*
               Червоний лазер:

               R дуже сильний
               G/B значно слабші
            */

            if (r < 130) continue;

            if (r - g < 65) continue;
            if (r - b < 65) continue;

            /*
               Наскільки цей піксель яскравіший
               за сусідів.
            */

            const il = (y * W + (x - 1)) * 4;
            const ir = (y * W + (x + 1)) * 4;
            const iu = ((y - 1) * W + x) * 4;
            const id = ((y + 1) * W + x) * 4;

            const neighbourR =
                (
                    data[il] +
                    data[ir] +
                    data[iu] +
                    data[id]
                ) / 4;

            const localContrast =
                r - neighbourR;

            /*
               Лазер повинен бути маленькою
               локальною яскравою плямою.
            */

            if (localContrast < 8) continue;

            let score =
                (r - g) * 1.8 +
                (r - b) * 1.8 +
                localContrast * 4 +
                r * 0.3;

            /*
               Перевіряємо маленьку область навколо
               кандидата.

               Це дозволяє знайти навіть лазер,
               який займає всього кілька пікселів.
            */

            let redPixels = 0;
            let totalRed = 0;

            for (
                let yy = Math.max(0, y - 3);
                yy <= Math.min(H - 1, y + 3);
                yy++
            ) {

                for (
                    let xx = Math.max(0, x - 3);
                    xx <= Math.min(W - 1, x + 3);
                    xx++
                ) {

                    const q =
                        (yy * W + xx) * 4;

                    const rr = data[q];
                    const gg = data[q + 1];
                    const bb = data[q + 2];

                    if (
                        rr > 100 &&
                        rr - gg > 45 &&
                        rr - bb > 45
                    ) {

                        redPixels++;

                        totalRed +=
                            rr - (gg + bb) / 2;
                    }
                }
            }

            if (redPixels < 1) continue;

            /*
               Дуже велика червона/помаранчева область
               не схожа на маленьку лазерну пляму.
            */

            if (redPixels > 45) continue;

            score +=
                totalRed * 1.5;

            /*
               Якщо це один із кутів,
               де знаходяться кольорові точки,
               не приймаємо його за лазер.
            */

            if (isNearCalibrationPoint(x, y)) {
                continue;
            }

            if (score > bestScore) {

                bestScore = score;

                bestX = x;
                bestY = y;
            }
        }
    }

    if (bestX < 0) {
        return null;
    }

    /*
       Додатково знаходимо центр маленької
       червоної плями навколо найкращого пікселя.
    */

    let sumX = 0;
    let sumY = 0;
    let sumWeight = 0;

    for (
        let y = Math.max(0, bestY - 5);
        y <= Math.min(H - 1, bestY + 5);
        y++
    ) {

        for (
            let x = Math.max(0, bestX - 5);
            x <= Math.min(W - 1, bestX + 5);
            x++
        ) {

            const i =
                (y * W + x) * 4;

            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            const red =
                r - Math.max(g, b);

            if (
                red > 50 &&
                r > 110
            ) {

                const weight =
                    red * red;

                sumX += x * weight;
                sumY += y * weight;
                sumWeight += weight;
            }
        }
    }

    if (sumWeight === 0) {
        return null;
    }

    return {
        x: sumX / sumWeight,
        y: sumY / sumWeight
    };
}


/* ---------------------------------------------------
   HOMOGRAPHY: КАМЕРА → ЕКРАН
--------------------------------------------------- */

function laserToScreen(p) {

    if (!calibration) return null;

    const h = calibration;

    const denominator =
        h[6] * p.x +
        h[7] * p.y +
        1;

    if (
        Math.abs(denominator) <
        0.000001
    ) {
        return null;
    }

    return {

        x:
            (
                h[0] * p.x +
                h[1] * p.y +
                h[2]
            ) / denominator,

        y:
            (
                h[3] * p.x +
                h[4] * p.y +
                h[5]
            ) / denominator
    };
}


/* ---------------------------------------------------
   ОСНОВНИЙ ЦИКЛ
--------------------------------------------------- */

function mainLoop() {

    if (!cameraReady) return;

    /*
       Кожні 5 секунд нове калібрування.
    */

    if (
        !calibration ||
        performance.now() - lastCalibration > 5000
    ) {

        calibrate();
    }

    /*
       Кадр камери.
    */

    actx.drawImage(
        video,
        0,
        0,
        W,
        H
    );

    /*
       Шукаємо лазер.
    */

    const laser = findLaser();

    if (laser) {

        const screen =
            laserToScreen(laser);

        if (screen) {

            /*
               Плавність руху.
            */

            if (lastLaser) {

                screen.x =
                    lastLaser.x * 0.25 +
                    screen.x * 0.75;

                screen.y =
                    lastLaser.y * 0.25 +
                    screen.y * 0.75;
            }

            /*
               Малюємо тільки якщо координата
               знаходиться на екрані.
            */

            if (
                screen.x >= 0 &&
                screen.x <= window.innerWidth &&
                screen.y >= 0 &&
                screen.y <= window.innerHeight
            ) {

                if (lastLaser) {

                    dctx.beginPath();

                    dctx.moveTo(
                        lastLaser.x,
                        lastLaser.y
                    );

                    dctx.lineTo(
                        screen.x,
                        screen.y
                    );

                    dctx.strokeStyle = "white";
                    dctx.lineWidth = 4;
                    dctx.lineCap = "round";

                    dctx.stroke();
                }

                lastLaser = screen;

                laserVisible = true;

                status.textContent =
                    "🔴 Лазер знайдено";
            }
        }

    } else {

        /*
           Не стираємо останню точку одразу,
           щоб маленький лазер не рвав лінію.
        */

        laserVisible = false;

        status.textContent =
            calibration
            ? "Калібрування OK • шукаю лазер"
            : "Калібрування...";
    }

    requestAnimationFrame(mainLoop);
}


/* ---------------------------------------------------
   ПЕРЕЗМІР ПОЛОТНА
--------------------------------------------------- */

function resize() {

    draw.width =
        window.innerWidth;

    draw.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resize
);

resize();

startCamera();

</script>

</body>
</html>
